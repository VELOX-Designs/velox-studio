<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VELOX mark: a clean, bold two-tone "V" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191f"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ec8d4" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#2f7dff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6ff3f7"/>
      <stop offset="1" stop-color="#14b4c2"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#9a7bff"/>
      <stop offset="1" stop-color="#2f7dff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".7" r=".55">
      <stop offset="0" stop-color="#1ec8d4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1ec8d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- right blade (behind) -->
  <path d="M302 126 L384 126 L282 396 L230 396 Z" fill="url(#right)"/>
  <!-- left blade (front) -->
  <path d="M128 126 L210 126 L282 396 L230 396 Z" fill="url(#left)"/>
</svg>
